# The gate CLAUDE.md asks for before a PR is opened, run on the PR itself:
# gofmt, vet, the daemon's tests (plain and under -race), and the interface's
# typecheck.
#
# Until this existed nothing checked a pull request -- packages.yml runs only on
# release tags -- so "no checks reported" on a PR meant nothing had run, and the
# local gate was on trust.
#
# The tests need no hardware: the daemon compiles and tests on a plain Linux
# runner, with the Linux-only paths compiled in. The contract tests
# (TestWireContractMirroredInUI, TestAPIDocsUpToDate) read ui/src and docs/,
# which is why the whole repository is checked out rather than daemon/ alone.
#
# -race is its own step, not a flag on the first run, so a race reads as a race
# rather than as a failing test. It could not run clean until #233.
name: Checks

on:
  pull_request:
    branches: [main]
  # And on main after a merge, so the state of main is visible rather than
  # inferred from the PR that produced it.
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes the run on the old one.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: daemon/go.mod
          # No dependencies, so no go.sum to key a cache on.
          cache: false

      # gofmt -l exits 0 whatever it finds, so the list itself is the verdict.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-clean -- run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: go test -race
        run: go test -race ./... -count=1

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        run: npm ci

      - name: typecheck
        run: npm run typecheck

# boa's package feeds, signed, on GitHub Pages: the OpenWrt apk feed (boa,
# luci-app-boa) under /openwrt/, and the apt repository (infinite-streaming-boa
# for arm64 and amd64) under /apt/.
#
# ONE workflow for both because a Pages deploy replaces the whole site: two
# workflows would each publish a site without the other's feed.
#
# Built by the same scripts/openwrt-package.sh and scripts/deb-package.sh a
# developer runs, so the feeds and a local build cannot drift. On an x86-64
# runner the OpenWrt SDK container runs natively rather than under emulation.
#
# On a release tag, and by hand. Not on every push to main: a device on this
# feed upgrades to whatever it serves, so it serves releases.
#
# Signing: the repository secrets BOA_APK_PRIVATE_KEY (apk) and
# BOA_APT_GPG_PRIVATE_KEY (apt) -- the keys clients already trust. The build
# refuses to run without either rather than let a script generate a fresh key
# that nothing trusts.
name: Package feeds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The feed path a device puts in /etc/apk/repositories.d is
  # openwrt/<release>/<its DISTRIB_ARCH>/, one per SDK below.
  OPENWRT_RELEASE: '25.12'
  OPENWRT_SDK_VERSION: '25.12.5'
  # SDK target, then the package architecture it must produce. The build is
  # checked against the second, so a renamed SDK cannot publish under the
  # wrong path. boad is the same static arm64 binary in both; only apk's label
  # differs, and apk refuses a package whose label is not the device's.
  #   bcm27xx-bcm2712  Raspberry Pi 5
  #   mediatek-filogic MT7981/MT7986 routers: Cudy TR3000, GL.iNet MT3000, ...
  #   x86-64           a PC, or a virtual machine
  OPENWRT_TARGETS: >-
    bcm27xx-bcm2712:aarch64_cortex-a76
    mediatek-filogic:aarch64_cortex-a53
    x86-64:x86_64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/version.sh is `git describe --tags`.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          # No dependencies, so no go.sum to key a cache on.
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install interface dependencies
        run: npm ci
        working-directory: ui

      - name: Install the signing key
        env:
          KEY: ${{ secrets.BOA_APK_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The BOA_APK_PRIVATE_KEY secret is not set. Refusing to sign with a new key no device trusts."
            exit 1
          fi
          mkdir -p cache/openwrt-keys
          ( umask 077; printf '%s\n' "$KEY" > cache/openwrt-keys/private-key.pem )
          openssl ec -in cache/openwrt-keys/private-key.pem -pubout \
            -out cache/openwrt-keys/public-key.pem 2>/dev/null

      - name: Install the apt archive key
        env:
          KEY: ${{ secrets.BOA_APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The BOA_APT_GPG_PRIVATE_KEY secret is not set. Refusing to sign with a new key no client trusts."
            exit 1
          fi
          mkdir -p cache/apt-keys
          ( umask 077; printf '%s\n' "$KEY" > cache/apt-keys/private.asc )

      - name: Build and sign the OpenWrt packages, one feed per architecture
        run: |
          # One release stamp for every feed, so a release has one version.
          export BOA_RELEASE="$(date -u +%Y%m%d%H%M)"
          for t in $OPENWRT_TARGETS; do
            sdk="${t%%:*}" arch="${t##*:}"
            SDK_IMAGE="openwrt/sdk:$sdk-$OPENWRT_SDK_VERSION" ./scripts/openwrt-package.sh \
              | tee build.log
            grep -q "^packed boa-.* ($arch):" build.log \
              || { echo "::error::$sdk did not produce $arch packages"; exit 1; }
            feed="site/openwrt/$OPENWRT_RELEASE/$arch"
            mkdir -p "$feed"
            cp dist/openwrt/*.apk dist/openwrt/packages.adb "$feed/"
          done

      - name: Build and sign the apt repository
        run: ./scripts/deb-package.sh

      - name: Assemble the site
        run: |
          cp cache/openwrt-keys/public-key.pem site/openwrt/boa-packages.pem
          cp -R dist/apt site/apt
          sed -e "s|@RELEASE@|$OPENWRT_RELEASE|g" \
              -e "s|@VERSION@|$(ls dist/openwrt/boa-[0-9]*.apk | sed -E 's|.*/boa-(.*)\.apk|\1|')|g" \
              -e "s|@DEBVERSION@|$(ls dist/deb/*_arm64.deb | sed -E 's|.*_(.*)_arm64\.deb|\1|')|g" \
              openwrt/feed/index.html > site/index.html
          rm -f cache/openwrt-keys/private-key.pem cache/apt-keys/private.asc
          find site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
